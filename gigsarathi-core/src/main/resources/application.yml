server:
  port: 8080

spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/gigsarathi}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

gigsarathi:
  whatsapp:
    api-url: https://graph.facebook.com/v19.0
    phone-number-id: ${WA_PHONE_NUMBER_ID}
    access-token: ${WA_ACCESS_TOKEN}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN}
    bot-username: ${TELEGRAM_BOT_USERNAME}
  admin:
    api-key: ${ADMIN_API_KEY}
